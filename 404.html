<!DOCTYPE html>
<html lang="vi">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.5rem;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #5d6478;
    background: linear-gradient(135deg, #9c3420, #6c2216);
  }
  .box { text-align: center; background: #fff; border-radius: 24px; padding: clamp(2rem, 5vw, 3.2rem); max-width: 560px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  img { height: 54px; width: auto; margin-bottom: 1.6rem; }
  .code { font-family: 'Sora', sans-serif; font-size: clamp(3rem, 10vw, 4.5rem); font-weight: 800; color: #b8341e; line-height: 1; margin: 0; }
  h1 { font-family: 'Sora', sans-serif; font-size: 1.35rem; color: #333949; margin: .8rem 0 .6rem; }
  p { margin: 0 0 1.6rem; line-height: 1.7; }
  .links { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; }
  a.btn {
    display: inline-flex; align-items: center; padding: .8rem 1.5rem; border-radius: 100px;
    font-weight: 600; font-size: .95rem; text-decoration: none; transition: transform .2s;
  }
  a.btn:hover { transform: translateY(-2px); }
  .btn--primary { background: #ad4229; color: #fff; }
  .btn--outline { border: 2px solid #ece5dc; color: #b8341e; }
</style>
</head>
<body>
  <div class="box">

    <div class="links">
      <a class="btn btn--primary" href="/quangthang-website/">Về trang chủ</a>
      <a class="btn btn--outline" href="/quangthang-website/products.html">Xem sản phẩm</a>
      <a class="btn btn--outline" href="/quangthang-website/contact.html">Liên hệ</a>
